services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    image: ahuvafogel/bloom-server:1.0
    build: ./server
    restart: unless-stopped
    env_file: .env
    environment:
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-focusflow}
      BLOOM_STEP_SECONDS: ${BLOOM_STEP_SECONDS:-120}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy

  client:
    image: ahuvafogel/bloom-client:1.0
    build: ./client
    restart: unless-stopped
    environment:
      BACKEND_URL: http://server:8000
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - server

volumes:
  mongo-data:
